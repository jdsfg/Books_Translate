name: Translation quality gate

on:
  pull_request:
    paths:
      - "sources/*.md"
      - "pipeline/translate/**"
      - "pipeline/translate_book.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: translation-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test quality-gate code
        run: python -m unittest discover -s pipeline/translate/tests -v

      - name: Run deterministic translation audit
        id: audit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set +e
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python pipeline/translate/audit_translation.py \
              --changed-since "$BASE_SHA" \
              --report "$RUNNER_TEMP/translation-audit.md" \
              --json-report "$RUNNER_TEMP/translation-audit.json"
          else
            python pipeline/translate/audit_translation.py \
              --all \
              --report "$RUNNER_TEMP/translation-audit.md" \
              --json-report "$RUNNER_TEMP/translation-audit.json"
          fi
          audit_exit=$?
          echo "exit_code=$audit_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Add report to job summary
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/translation-audit.md
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          report = Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(report)
          PY

      - name: Publish or update PR audit comment
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python pipeline/translate/publish_audit_comment.py \
            --repository "${{ github.repository }}" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --report "$RUNNER_TEMP/translation-audit.md"

      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/translation-audit.md
            ${{ runner.temp }}/translation-audit.json
          retention-days: 30

      - name: Enforce quality gate
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo "Translation quality gate reported blocking findings."
          exit 1
